name: Release

# Builds all four installer formats and attaches them to a GitHub release:
#   Rongyok Desk_<version>_x64-setup.exe     Windows, NSIS installer
#   Rongyok Desk_<version>_x64_en-US.msi     Windows, MSI installer
#   Rongyok Desk_<version>_<arch>.dmg        macOS, disk image
#   Rongyok-Desk-<version>-<arch>.flatpak    Linux, Flatpak bundle
#
# Push a tag like v1.0.0 to publish a release. You can also run it by hand from
# the Actions tab to get the installers as downloadable files, without
# publishing anything.
#
# WHERE THIS FILE GOES: GitHub only reads workflows from .github/workflows at
# the top of the repository. This copy sits inside app/, next to the code it
# builds. If app/ is the top of your repository, it is already in the right
# place. If your repository has app/ one level down, copy this file to
# <repo root>/.github/workflows/release.yml.
#
# Either layout works: every job first finds the folder holding tauri.conf.json
# and builds there, so it does not matter how deep the app sits.

# Build jobs compile platform bundles only (includeUpdaterJson: false, no per-job
# GitHub Release creation) to avoid parallel draft races and latest.json
# overwrites. The final `publish-release` job creates/publishes the release and
# uploads all installers + latest.json atomically on tag pushes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (nsis .exe + msi .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the app folder
        id: app
        shell: bash
        run: |
          set -euo pipefail
          conf="$(find . -name tauri.conf.json \
            -not -path '*/target/*' -not -path '*/node_modules/*' | head -n 1)"
          [ -n "$conf" ] || { echo "No tauri.conf.json found"; exit 1; }
          echo "path=$(dirname "$conf")" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ steps.app.outputs.path }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clean stale release bundles from cache
        shell: bash
        run: rm -rf "${{ steps.app.outputs.path }}/target/"*/release/bundle "${{ steps.app.outputs.path }}/target/release/bundle"

      - name: Configure Windows Authenticode signing (if secrets set)
        id: win_sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "extra_args="
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "win-sign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE.Trim()))
            $sec = if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              New-Object System.Security.SecureString
            } else {
              ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            }
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          } finally {
            Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          }
          $thumb = if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            $env:WINDOWS_CERTIFICATE_THUMBPRINT.Trim()
          } else {
            ($cert | Where-Object { $_.HasPrivateKey } | Select-Object -First 1).Thumbprint
          }
          if ([string]::IsNullOrWhiteSpace($thumb)) {
            throw "Windows signing certificate thumbprint could not be resolved"
          }
          $tsUrl = if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            $env:WINDOWS_TIMESTAMP_URL.Trim()
          } else {
            "http://timestamp.digicert.com"
          }
          $cfgPath = Join-Path $env:RUNNER_TEMP "tauri.win-sign.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumb
                digestAlgorithm = "sha256"
                timestampUrl = $tsUrl
                tsp = $true
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $cfgPath -Encoding UTF8
          $cfgArg = $cfgPath.Replace('\', '/')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "extra_args=--config $cfgArg"

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Build bundles only; `publish-release` creates the release & latest.json.
          projectPath: ${{ steps.app.outputs.path }}
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc ${{ steps.win_sign.outputs.extra_args }}

      - name: Verify Windows bundles exist
        shell: bash
        env:
          WIN_SIGN_EXTRA_ARGS: ${{ steps.win_sign.outputs.extra_args }}
        run: |
          set -euo pipefail
          compgen -G "${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" >/dev/null
          compgen -G "${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" >/dev/null
          if node -e 'const fs=require("fs"), c=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.exit(c.bundle && c.bundle.createUpdaterArtifacts ? 0 : 1)' "${{ steps.app.outputs.path }}/tauri.conf.json"; then
            compgen -G "${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig" >/dev/null
            compgen -G "${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig" >/dev/null
          fi
          if [ -n "${WIN_SIGN_EXTRA_ARGS:-}" ]; then
            signtool_bin="$(command -v signtool.exe || command -v signtool || true)"
            if [ -z "$signtool_bin" ]; then
              signtool_bin="$(find "/c/Program Files (x86)/Windows Kits/10/bin" -path "*/x64/signtool.exe" 2>/dev/null | sort -V | tail -n 1 || true)"
            fi
            [ -n "$signtool_bin" ] || { echo "signtool.exe not found"; exit 1; }
            for f in \
              "${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/nsis/"*.exe \
              "${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/msi/"*.msi; do
              echo "Verifying Authenticode signature: $f"
              win_f="$(cygpath -w "$f" 2>/dev/null || printf '%s' "$f")"
              MSYS_NO_PATHCONV=1 "$signtool_bin" verify /pa "$win_f"
            done
          fi

      # Keep installers (and any .sig files when updater signing is enabled).
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            ${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            ${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            ${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ${{ steps.app.outputs.path }}/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  # One job per chip: a .dmg has to be built on the machine it is meant for.
  macos:
    name: macOS (dmg .dmg, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15      # Apple Silicon
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15      # Cross-compile Intel on Apple Silicon runner
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Find the app folder
        id: app
        shell: bash
        run: |
          set -euo pipefail
          conf="$(find . -name tauri.conf.json \
            -not -path '*/target/*' -not -path '*/node_modules/*' | head -n 1)"
          [ -n "$conf" ] || { echo "No tauri.conf.json found"; exit 1; }
          echo "path=$(dirname "$conf")" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ steps.app.outputs.path }}/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Clean stale release bundles from cache
        shell: bash
        run: rm -rf "${{ steps.app.outputs.path }}/target/"*/release/bundle "${{ steps.app.outputs.path }}/target/release/bundle"

      - name: Configure macOS signing & notarization (if secrets set)
        shell: bash
        env:
          CFG_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CFG_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CFG_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CFG_APPLE_ID: ${{ secrets.APPLE_ID }}
          CFG_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          CFG_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CFG_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CFG_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CFG_APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          # Only export non-empty variables; tauri-bundler fails if empty APPLE_* keys exist.
          if [ -z "$CFG_APPLE_CERTIFICATE" ]; then
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<EOF_APPLE_CERT"
            printf '%s\n' "$CFG_APPLE_CERTIFICATE"
            echo "EOF_APPLE_CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=${CFG_APPLE_CERTIFICATE_PASSWORD:-}"
          } >> "$GITHUB_ENV"

          has_identity=false
          if [ -n "$CFG_APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$CFG_APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            has_identity=true
          fi

          has_notary=false
          if [ -n "$CFG_APPLE_ID" ] && [ -n "$CFG_APPLE_PASSWORD" ] && [ -n "$CFG_APPLE_TEAM_ID" ]; then
            echo "APPLE_ID=$CFG_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$CFG_APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$CFG_APPLE_TEAM_ID" >> "$GITHUB_ENV"
            has_notary=true
          elif [ -n "$CFG_APPLE_API_KEY" ] && [ -n "$CFG_APPLE_API_ISSUER" ] && [ -n "$CFG_APPLE_API_KEY_CONTENT" ]; then
            p8_path="${RUNNER_TEMP}/AuthKey_${CFG_APPLE_API_KEY}.p8"
            if printf '%s' "$CFG_APPLE_API_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$CFG_APPLE_API_KEY_CONTENT" > "$p8_path"
            else
              printf '%s' "$CFG_APPLE_API_KEY_CONTENT" | base64 --decode > "$p8_path"
            fi
            chmod 600 "$p8_path"
            echo "APPLE_API_KEY=$CFG_APPLE_API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$CFG_APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$p8_path" >> "$GITHUB_ENV"
            has_notary=true
          fi

          if [ "$has_identity" = true ] && [ "$has_notary" = true ]; then
            echo "RONGYOK_MACOS_SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Build the disk image
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ steps.app.outputs.path }}
          includeUpdaterJson: false
          # Include `app` so createUpdaterArtifacts: true produces .app.tar.gz + .sig.
          args: --target ${{ matrix.target }} --bundles dmg,app

      - name: Verify macOS bundle exists
        shell: bash
        run: |
          set -euo pipefail
          compgen -G "${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/dmg/*.dmg" >/dev/null
          if node -e 'const fs=require("fs"), c=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.exit(c.bundle && c.bundle.createUpdaterArtifacts ? 0 : 1)' "${{ steps.app.outputs.path }}/tauri.conf.json"; then
            compgen -G "${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz" >/dev/null
            compgen -G "${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig" >/dev/null
          fi
          if [ "${RONGYOK_MACOS_SIGNED:-}" = "1" ]; then
            if compgen -G "${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/macos/*.app" >/dev/null; then
              for app in "${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/macos/"*.app; do
                echo "Verifying macOS app signature: $app"
                codesign --verify --deep --strict --verbose=2 "$app"
                xcrun stapler validate "$app"
              done
            fi
            for dmg in "${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg; do
              echo "Verifying macOS dmg signature and stapled ticket: $dmg"
              codesign --verify --strict --verbose=2 "$dmg"
              xcrun stapler validate "$dmg"
            done
          fi

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            ${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            ${{ steps.app.outputs.path }}/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  # The .flatpak is not built by tauri-action: Flatpak is its own packaging
  # system, and flatpak-builder has to compile the app inside the runtime
  # sandbox so the result links against that runtime's libraries.
  flatpak:
    name: Linux (flatpak .flatpak)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Find the app folder
        id: app
        shell: bash
        run: |
          set -euo pipefail
          conf="$(find . -name tauri.conf.json \
            -not -path '*/target/*' -not -path '*/node_modules/*' | head -n 1)"
          [ -n "$conf" ] || { echo "No tauri.conf.json found"; exit 1; }
          echo "path=$(dirname "$conf")" >> "$GITHUB_OUTPUT"

      - name: Install flatpak and flatpak-builder
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # The runtime, the SDK, and the extension carrying Rust: the manifest
          # names all three.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build the Flatpak
        working-directory: ${{ steps.app.outputs.path }}
        run: ./flatpak/build-flatpak.sh

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: ${{ steps.app.outputs.path }}/dist/flatpak/*.flatpak
          if-no-files-found: error

  # -------------------------------------------------------- Publish Release
  publish-release:
    name: Publish release & latest.json
    needs: [windows, macos, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Stage installers and generate latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import shutil

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          tag_version = tag.removeprefix("v")

          conf_files = [
              p for p in pathlib.Path(".").rglob("tauri.conf.json")
              if "target" not in p.parts and "node_modules" not in p.parts
          ]
          if not conf_files:
              raise SystemExit("tauri.conf.json not found")
          app_dir = conf_files[0].parent
          conf = json.loads(conf_files[0].read_text(encoding="utf-8"))
          conf_version = conf["version"]
          if tag_version != conf_version:
              raise SystemExit(
                  f"Tag version ({tag_version}) does not match tauri.conf.json ({conf_version})"
              )
          updater_enabled = bool(conf.get("bundle", {}).get("createUpdaterArtifacts"))

          artifacts_root = pathlib.Path("release-artifacts")
          stage_dir = pathlib.Path("dist-release")
          stage_dir.mkdir(parents=True, exist_ok=True)

          def find_single(subdir: str, suffix: str, required: bool = True):
              base = artifacts_root / subdir
              matches = sorted(
                  p for p in base.rglob("*") if p.is_file() and p.name.endswith(suffix)
              )
              if not matches:
                  if required:
                      raise SystemExit(f"Missing required artifact *{suffix} in {base}")
                  return None
              if len(matches) > 1:
                  raise SystemExit(f"Expected 1 *{suffix} in {base}, found {len(matches)}")
              return matches[0]

          def stage_file(src: pathlib.Path, dest_name: str | None = None) -> str:
              # Normalize spaces to dots so local names match GitHub release asset URLs.
              name = (dest_name or src.name).replace(" ", ".")
              shutil.copy2(src, stage_dir / name)
              return name

          def read_sig(sig_path: pathlib.Path) -> str:
              sig_text = sig_path.read_text(encoding="utf-8").strip()
              if not sig_text:
                  raise SystemExit(f"Empty updater signature file: {sig_path}")
              return sig_text

          def size_bytes(asset_name: str) -> int:
              return (stage_dir / asset_name).stat().st_size

          def size_mb_label(asset_name: str) -> str:
              return f"{size_bytes(asset_name) / 1_000_000:.2f} MB"

          def extract_changelog_notes(changelog_path: pathlib.Path, version: str):
              if not changelog_path.is_file():
                  return None, None
              content = changelog_path.read_text(encoding="utf-8")
              import re
              heading_re = re.compile(
                  rf"^##\s+\[?v?{re.escape(version)}\]?(?:\s*-\s*([^\r\n]+))?\s*$",
                  re.MULTILINE,
              )
              match = heading_re.search(content)
              if not match:
                  return None, None
              start = match.end()
              next_heading = re.search(r"^##\s+\[?", content[start:], re.MULTILINE)
              body = content[start : start + next_heading.start()] if next_heading else content[start:]
              md_body = body.strip()
              if not md_body:
                  return None, None
              plain_lines = []
              for raw_line in md_body.splitlines():
                  s = raw_line.strip()
                  if not s:
                      continue
                  s = re.sub(r"^###\s+", "", s)
                  s = re.sub(r"\*\*(.+?)\*\*", r"\1", s)
                  s = s.replace("`", "")
                  plain_lines.append(s)
              plain_text = "\n".join(plain_lines)
              if len(plain_text) > 580:
                  plain_text = plain_text[:577].rstrip() + "..."
              return md_body, plain_text

          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          exe_src = find_single("windows-installers", ".exe")
          exe_name = stage_file(exe_src)
          exe_sig = find_single("windows-installers", ".exe.sig", required=updater_enabled)

          msi_src = find_single("windows-installers", ".msi")
          msi_name = stage_file(msi_src)
          msi_sig = find_single("windows-installers", ".msi.sig", required=updater_enabled)

          mac_arm_dmg = find_single("macos-dmg-aarch64", ".dmg")
          mac_arm_name = stage_file(mac_arm_dmg)
          mac_arm_tar = find_single("macos-dmg-aarch64", ".app.tar.gz", required=updater_enabled)
          mac_arm_sig = find_single("macos-dmg-aarch64", ".app.tar.gz.sig", required=updater_enabled)

          mac_x64_dmg = find_single("macos-dmg-x86_64", ".dmg")
          mac_x64_name = stage_file(mac_x64_dmg)
          mac_x64_tar = find_single("macos-dmg-x86_64", ".app.tar.gz", required=updater_enabled)
          mac_x64_sig = find_single("macos-dmg-x86_64", ".app.tar.gz.sig", required=updater_enabled)

          flatpak_src = find_single("linux-flatpak", ".flatpak")
          flatpak_name = stage_file(flatpak_src)

          platforms = {}
          if exe_sig:
              stage_file(exe_sig)
              entry = {"url": f"{base_url}/{exe_name}", "signature": read_sig(exe_sig)}
              platforms["windows-x86_64-nsis"] = entry
              platforms["windows-x86_64"] = entry
          if msi_sig:
              stage_file(msi_sig)
              platforms["windows-x86_64-msi"] = {
                  "url": f"{base_url}/{msi_name}",
                  "signature": read_sig(msi_sig),
              }
          if mac_arm_tar and mac_arm_sig:
              tar_name = stage_file(mac_arm_tar, f"Rongyok.Desk_{conf_version}_aarch64.app.tar.gz")
              stage_file(mac_arm_sig, f"{tar_name}.sig")
              platforms["darwin-aarch64"] = {
                  "url": f"{base_url}/{tar_name}",
                  "signature": read_sig(mac_arm_sig),
              }
          if mac_x64_tar and mac_x64_sig:
              tar_name = stage_file(mac_x64_tar, f"Rongyok.Desk_{conf_version}_x64.app.tar.gz")
              stage_file(mac_x64_sig, f"{tar_name}.sig")
              platforms["darwin-x86_64"] = {
                  "url": f"{base_url}/{tar_name}",
                  "signature": read_sig(mac_x64_sig),
              }

          md_notes, plain_notes = extract_changelog_notes(app_dir / "CHANGELOG.md", conf_version)
          fallback_notes = f"Rongyok Desk {tag} (Windows, macOS, Linux Flatpak)."
          manifest_notes = plain_notes or fallback_notes
          if md_notes:
              (artifacts_root / "release-notes.md").write_text(
                  md_notes + "\n", encoding="utf-8"
              )

          pub_ts = datetime.datetime.now(datetime.timezone.utc)
          manifest = {
              "version": conf_version,
              "notes": manifest_notes,
              "pub_date": pub_ts.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
              "downloads": {
                  "windows-x86_64-nsis": f"{base_url}/{exe_name}",
                  "windows-x86_64-msi": f"{base_url}/{msi_name}",
                  "darwin-aarch64-dmg": f"{base_url}/{mac_arm_name}",
                  "darwin-x86_64-dmg": f"{base_url}/{mac_x64_name}",
                  "linux-x86_64-flatpak": f"{base_url}/{flatpak_name}",
              },
          }
          latest_path = stage_dir / "latest.json"
          latest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          json.loads(latest_path.read_text(encoding="utf-8"))

          checksum_lines = []
          for asset_file in sorted(stage_dir.iterdir()):
              if not asset_file.is_file() or asset_file.name == "SHA256SUMS.txt":
                  continue
              digest = hashlib.sha256()
              with asset_file.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      digest.update(chunk)
              checksum_lines.append(f"{digest.hexdigest()}  {asset_file.name}")
          (stage_dir / "SHA256SUMS.txt").write_text(
              "\n".join(checksum_lines) + "\n", encoding="utf-8", newline="\n"
          )

          installer_names = [exe_name, msi_name, mac_arm_name, mac_x64_name, flatpak_name]
          sizes_bytes = [size_bytes(name) for name in installer_names]
          size_range = f"{min(sizes_bytes) / 1_000_000:.2f} – {max(sizes_bytes) / 1_000_000:.2f} MB"
          summary_line = manifest_notes.splitlines()[0].lstrip("- ").strip() if plain_notes else fallback_notes

          # Keep docs sync metadata outside dist-release/ so gh release does not upload it.
          meta = {
              "tag": tag,
              "version": conf_version,
              "pub_date_short": pub_ts.strftime("%Y-%m-%d"),
              "summary_line": summary_line,
              "size_range": size_range,
              "app_dir": app_dir.as_posix(),
              "assets": {
                  "exe": {"name": exe_name, "size": size_mb_label(exe_name)},
                  "msi": {"name": msi_name, "size": size_mb_label(msi_name)},
                  "mac_arm": {"name": mac_arm_name, "size": size_mb_label(mac_arm_name)},
                  "mac_x64": {"name": mac_x64_name, "size": size_mb_label(mac_x64_name)},
                  "flatpak": {"name": flatpak_name, "size": size_mb_label(flatpak_name)},
              },
          }
          (artifacts_root / "release-meta.json").write_text(
              json.dumps(meta, indent=2) + "\n", encoding="utf-8"
          )

          print("Staged release assets:")
          for item in sorted(stage_dir.iterdir()):
              print(f"  - {item.name} ({item.stat().st_size} bytes)")
          PY

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_args=(--generate-notes)
          if [ -s release-artifacts/release-notes.md ]; then
            notes_args=(--notes-file release-artifacts/release-notes.md)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --draft=false --latest --title "Rongyok Desk $TAG" "${notes_args[@]}"
          else
            gh release create "$TAG" dist-release/* \
              --title "Rongyok Desk $TAG" \
              "${notes_args[@]}" \
              --latest
          fi

      - name: Sync download links & sizes on main and deploy Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main

          changed_files="$(python3 - <<'PY'
          import json
          import pathlib
          import re

          meta = json.loads(
              pathlib.Path("release-artifacts/release-meta.json").read_text(encoding="utf-8")
          )
          ver = meta["version"]
          tag = meta["tag"]
          assets = meta["assets"]
          app_dir = pathlib.Path(meta["app_dir"])

          def parse_semver(raw: str) -> tuple[int, int, int] | None:
              m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", raw.strip())
              return tuple(int(part) for part in m.groups()) if m else None

          rel_tuple = parse_semver(ver)
          if rel_tuple is None:
              print("SKIP: non-stable tag", flush=True)
              raise SystemExit(0)

          conf_path = app_dir / "tauri.conf.json"
          if conf_path.is_file():
              main_ver = json.loads(conf_path.read_text(encoding="utf-8")).get("version", "")
              main_tuple = parse_semver(main_ver)
              if main_tuple is not None and rel_tuple < main_tuple:
                  print(f"SKIP: main is already ahead ({main_ver} > {ver})", flush=True)
                  raise SystemExit(0)

          base_latest = "https://github.com/EEMEEMMEEx/rongyok-desk/releases/latest/download/"

          def update_markdown(text: str) -> str:
              text = re.sub(
                  r"(version-v)\d+\.\d+\.\d+(-e4b65e)",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(r'(alt="Version v)\d+\.\d+\.\d+(")', rf"\g<1>{ver}\2", text)
              text = re.sub(
                  r"((?:## Download|## ดาวน์โหลด) \(`v)\d+\.\d+\.\d+(`\))",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r"((?:The|ตัวติดตั้ง) `v)\d+\.\d+\.\d+(`)",
                  rf"\g<1>{ver}\2",
                  text,
              )

              replacements = [
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_x64-setup\.exe",
                      assets["exe"]["name"],
                      assets["exe"]["size"],
                  ),
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_x64_en-US\.msi",
                      assets["msi"]["name"],
                      assets["msi"]["size"],
                  ),
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_aarch64\.dmg",
                      assets["mac_arm"]["name"],
                      assets["mac_arm"]["size"],
                  ),
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_x64\.dmg",
                      assets["mac_x64"]["name"],
                      assets["mac_x64"]["size"],
                  ),
                  (
                      r"Rongyok-Desk-\d+\.\d+\.\d+-x86_64\.flatpak",
                      assets["flatpak"]["name"],
                      assets["flatpak"]["size"],
                  ),
              ]
              for name_pat, new_name, new_size in replacements:
                  text = re.sub(
                      rf"(\|\s*)\d+\.\d+\s+MB(\s*\|\s*\[{name_pat}\]\({re.escape(base_latest)}{name_pat}\))",
                      rf"\g<1>{new_size}\2",
                      text,
                  )
                  text = re.sub(name_pat, new_name, text)
              return text

          def update_docs_html(text: str) -> str:
              text = re.sub(
                  r"(Rongyok Desk v)\d+\.\d+\.\d+( is a lightweight)",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r'(<span class="brand-version">v)\d+\.\d+\.\d+(</span>)',
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r"(<span>Version )\d+\.\d+\.\d+( · Rust \+ Tauri)",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r'(<p class="section-eyebrow">Version )\d+\.\d+\.\d+(</p>)',
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r"(Rongyok Desk v)\d+\.\d+\.\d+( across Windows)",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r"(signature verification details for v)\d+\.\d+\.\d+( builds\.)",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r"(<code>v)\d+\.\d+\.\d+(</code> Windows installers are digitally signed\.)",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r"(<strong>Rongyok Desk v)\d+\.\d+\.\d+(</strong>)",
                  rf"\g<1>{ver}\2",
                  text,
              )
              text = re.sub(
                  r"(<dt>Package Size</dt>\s*<dd>)\d+\.\d+\s*[–-]\s*\d+\.\d+\s+MB(</dd>)",
                  rf"\g<1>{meta['size_range']}\2",
                  text,
                  flags=re.DOTALL,
              )

              card_replacements = [
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_x64-setup\.exe",
                      assets["exe"]["name"],
                      assets["exe"]["size"],
                  ),
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_x64_en-US\.msi",
                      assets["msi"]["name"],
                      assets["msi"]["size"],
                  ),
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_aarch64\.dmg",
                      assets["mac_arm"]["name"],
                      assets["mac_arm"]["size"],
                  ),
                  (
                      r"Rongyok\.Desk_\d+\.\d+\.\d+_x64\.dmg",
                      assets["mac_x64"]["name"],
                      assets["mac_x64"]["size"],
                  ),
                  (
                      r"Rongyok-Desk-\d+\.\d+\.\d+-x86_64\.flatpak",
                      assets["flatpak"]["name"],
                      assets["flatpak"]["size"],
                  ),
              ]
              for name_pat, new_name, new_size in card_replacements:
                  text = re.sub(
                      rf"(<dd><code>{name_pat}</code></dd>\s*</div>\s*<div>\s*<dt>Size</dt>\s*<dd>)\d+\.\d+\s+MB(</dd>)",
                      rf"\g<1>{new_size}\2",
                      text,
                      flags=re.DOTALL,
                  )
                  text = re.sub(name_pat, new_name, text)
              return text

          def update_metainfo(text: str) -> str:
              if f'<release version="{ver}"' in text:
                  return text
              import html
              summary_xml = html.escape(meta.get("summary_line") or f"Release {tag}.")
              entry = (
                  f'    <release version="{ver}" date="{meta["pub_date_short"]}">\n'
                  f"      <description>\n"
                  f"        <p>{summary_xml}</p>\n"
                  f"      </description>\n"
                  f"    </release>"
              )
              return re.sub(r"(<releases>\s*\n)", rf"\1{entry}\n", text, count=1)

          targets = [
              (app_dir / "README.md", update_markdown),
              (app_dir / "README.th.md", update_markdown),
              (app_dir / "docs" / "index.html", update_docs_html),
              (app_dir / "flatpak" / "com.rongyok.ssb.metainfo.xml", update_metainfo),
          ]
          updated = []
          for path, updater in targets:
              if not path.is_file():
                  continue
              before = path.read_text(encoding="utf-8")
              after = updater(before)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  updated.append(path.as_posix())
          print("\n".join(updated))
          PY
          )"

          if echo "$changed_files" | grep -q '^SKIP:'; then
            echo "$changed_files"
            exit 0
          fi

          if [ -z "$changed_files" ]; then
            echo "Docs already up to date for $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r file; do
            [ -n "$file" ] && git add "$file"
          done <<< "$changed_files"

          if ! git diff --cached --quiet; then
            git commit -m "docs: update download links and sizes for $TAG"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed, rebasing onto origin/main..."
              git pull --rebase origin main
            done
            [ "$pushed" = true ]
          fi

          if echo "$changed_files" | grep -q 'docs/index\.html$'; then
            gh workflow run pages.yml --ref main
          fi
