name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate docs folder
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "docs/index.html" ]; then
            echo "path=docs" >> "$GITHUB_OUTPUT"
          elif [ -f "app/docs/index.html" ]; then
            echo "path=app/docs" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find docs/index.html" >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.docs.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
