name: Auto Tag Release

on:
  push:
    branches:
      - main
    paths:
      - 'tauri.conf.json'
      - 'app/tauri.conf.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag from tauri.conf.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          conf="$(find . -name tauri.conf.json \
            -not -path '*/target/*' -not -path '*/node_modules/*' | head -n 1)"
          [ -n "$conf" ] || { echo "tauri.conf.json not found" >&2; exit 1; }
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"].strip())' "$conf")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-release version '$version'"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create tag and trigger Release workflow
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          # GITHUB_TOKEN tag pushes do not emit push events, so dispatch Release explicitly on the tag ref.
          gh workflow run release.yml --ref "refs/tags/$TAG"
